# Airflow with the WasteWiseAI DAG.
#
#   docker compose -f airflow/docker-compose.yml up
#   open http://localhost:8080   (user: airflow / airflow)
#
# The project is mounted into the scheduler, so the DAG runs the same scripts
# the local runner runs and publishes into the same data/marts folder.
#
# The services run as root because the mounted project directory belongs to
# the developer on the host. A real deployment gives the scheduler a user that
# can write to data/ and dbt_project/target/ and drops "user: 0:0".
x-airflow-environment: &airflow-environment
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  WASTEWISE_ROOT: /opt/wastewise
  WASTEWISE_SYNTHETIC: "1"
  WASTEWISE_WAIT_FOR_DELIVERY: "1"
  WASTEWISE_SCHEDULE: "0 5 * * *"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    build:
      context: ..
      dockerfile: airflow/Dockerfile
    environment: *airflow-environment
    volumes:
      - ../:/opt/wastewise
      - ./dags:/opt/airflow/dags
    user: "0:0"
    command: airflow db migrate
    depends_on:
      postgres:
        condition: service_healthy

  airflow-api-server:
    build:
      context: ..
      dockerfile: airflow/Dockerfile
    environment: *airflow-environment
    volumes:
      - ../:/opt/wastewise
      - ./dags:/opt/airflow/dags
    user: "0:0"
    command: airflow api-server --port 8080
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    build:
      context: ..
      dockerfile: airflow/Dockerfile
    environment: *airflow-environment
    volumes:
      - ../:/opt/wastewise
      - ./dags:/opt/airflow/dags
    user: "0:0"
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
