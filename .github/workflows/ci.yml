name: validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warehouse:
    name: pipeline and warehouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic deliveries
        run: python ingestion/generate_synthetic.py

      - name: Run the full pipeline
        run: python scripts/run_end_to_end.py

      - name: Assert the published artefacts are reproducible
        run: |
          cp -r data/marts /tmp/first_run
          make clean
          python ingestion/generate_synthetic.py
          python scripts/run_end_to_end.py
          python scripts/check_reproducible.py /tmp/first_run data/marts

      - name: Test suite
        run: python -m unittest discover -s tests -v

      - name: Assert the publish gate is open and every metric is protected
        run: python scripts/gate_status.py

      - name: Upload published artefacts
        uses: actions/upload-artifact@v4
        with:
          name: published-artefacts
          path: data/marts
          retention-days: 7

  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Syntax check the dashboard
        run: npm run check

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Publish the artefacts the dashboard reads
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          python3 ingestion/generate_synthetic.py
          python3 scripts/run_end_to_end.py

      - name: Browser smoke test
        run: npm run test:frontend

      - name: Accessibility and contrast audit
        run: npm run test:a11y

      - name: Blocked gate shows no stale numbers
        run: npm run test:blocked
